<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>PHISWARE · Sitio bloqueado</title>
  <link rel="stylesheet" href="warning.css" />
</head>
<body>
  <main class="shell">
    <section class="card" aria-live="assertive">
      <div class="shield" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/>
          <path d="M12 8v5"/><path d="M12 16.5v.01"/>
        </svg>
      </div>

      <p class="eyebrow" id="eyebrow">PHISWARE Link Guard</p>
      <h1 id="title">Sitio peligroso bloqueado</h1>
      <p class="sub" id="sub">Lo detuvimos antes de cargar para proteger tus datos.</p>

      <div class="domain" id="domain" dir="ltr">…</div>

      <div class="meter" aria-hidden="true"><div class="meter-fill" id="meterFill"></div></div>
      <p class="score" id="score"></p>

      <h2 class="why" id="whyTitle">Por qué es riesgoso</h2>
      <ul class="reasons" id="reasons"></ul>

      <div class="actions">
        <button id="back" class="btn primary" type="button">Volver a un lugar seguro</button>
        <button id="continue" class="btn ghost" type="button">Continuar de todos modos</button>
      </div>
      <p class="fine" id="fine">“Continuar” solo vale 30 minutos para este sitio. No ingreses contraseñas ni datos personales.</p>
    </section>
  </main>
  <script src="warning.js"></script>
</body>
</html>
