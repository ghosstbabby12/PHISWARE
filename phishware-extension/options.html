<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PHISWARE Link Guard — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #17171c; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      input { background: #1e293b; color: #f1f5f9; border-color: #334155; }
    }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #c9c6ce; border-radius: 8px; box-sizing: border-box; }
    small { color: #686873; }
    button { margin-top: 16px; padding: 8px 18px; border-radius: 8px; border: none; background: #790D2B; color: #fff; font-weight: 600; cursor: pointer; }
    #status { margin-top: 12px; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>PHISWARE Link Guard</h1>
  <div id="form">
    <label for="backendRoot" data-i18n="optionsBackendLabel">URL del backend</label>
    <input id="backendRoot" type="url" spellcheck="false" placeholder="http://localhost:8080/api" />
    <small id="backendHelp" data-i18n="optionsHelp">URL base de tu backend PHISWARE (sin /public/url/check). Por defecto: http://localhost:8080/api</small>
    <div><button id="save" type="button" data-i18n="optionsSave">Guardar</button></div>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
