<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHISWARE Link Guard</title>
  <style>
    :root {
      --bg: #1e1e2e; --surface: #313244; --text: #cdd6f4;
      --muted: #6c7086; --danger: #f38ba8; --warn: #fab387;
      --safe: #a6e3a1; --accent: #89b4fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      width: 340px; min-height: 280px;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--surface);
    }
    .logo { font-size: 22px; }
    .header-title { flex: 1; }
    .header-title h1 { font-size: 14px; font-weight: 700; color: var(--accent); }
    .header-title p  { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.connected { background: var(--safe); }
    .status-dot.error     { background: var(--danger); }

    /* Current page section */
    .section { padding: 14px 16px; border-bottom: 1px solid var(--surface); }
    .section-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px;
    }

    .page-result {
      display: flex; align-items: center; gap: 10px;
    }
    .badge {
      padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700;
    }
    .badge.DANGEROUS  { background: rgba(243,139,168,0.2); color: var(--danger); }
    .badge.SUSPICIOUS { background: rgba(250,179,135,0.2); color: var(--warn); }
    .badge.SAFE       { background: rgba(166,227,161,0.2); color: var(--safe); }
    .badge.loading    { background: var(--surface); color: var(--muted); }

    .page-info { flex: 1; min-width: 0; }
    .page-domain { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-score  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Indicators */
    .indicators { margin-top: 10px; }
    .indicator-item {
      font-size: 11px; color: var(--warn);
      padding: 3px 0; border-bottom: 1px solid var(--surface);
    }
    .indicator-item:last-child { border: none; }

    /* Alerts list */
    .alerts-list { max-height: 150px; overflow-y: auto; }
    .alert-item {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 8px 0; border-bottom: 1px solid var(--surface);
    }
    .alert-item:last-child { border: none; }
    .alert-icon { font-size: 14px; flex-shrink: 0; }
    .alert-content { flex: 1; min-width: 0; }
    .alert-domain { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert-time   { font-size: 10px; color: var(--muted); }

    .empty { font-size: 12px; color: var(--muted); text-align: center; padding: 16px 0; }

    /* Footer */
    .footer {
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .footer a {
      font-size: 11px; color: var(--accent); text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .clear-btn {
      font-size: 11px; color: var(--muted); background: none; border: none;
      cursor: pointer; padding: 0;
    }
    .clear-btn:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div class="header-title">
      <h1>PHISWARE Link Guard</h1>
      <p id="backend-status">Verificando conexión…</p>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <div class="section">
    <div class="section-label">Página actual</div>
    <div class="page-result">
      <span class="badge loading" id="page-badge">…</span>
      <div class="page-info">
        <div class="page-domain" id="page-domain">—</div>
        <div class="page-score"  id="page-score"></div>
      </div>
    </div>
    <div class="indicators" id="indicators"></div>
  </div>

  <div class="section">
    <div class="section-label">Alertas recientes</div>
    <div class="alerts-list" id="alerts-list">
      <div class="empty">Sin alertas</div>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:5173" target="_blank">Abrir PHISWARE</a>
    <button class="clear-btn" id="clear-btn">Limpiar alertas</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
