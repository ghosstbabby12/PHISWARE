server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and static assets share the same origin in production.
  # Se usa variable + resolver para que nginx no falle al arrancar
  # si el backend aún no resuelve por DNS (evita "host not found in upstream").
  location /api/ {
    # Variable + resolver: nginx re-resuelve "backend" en cada ventana de 10s
    # (si el backend se reinicia y cambia de IP, no se queda con DNS rancia).
    # OJO: con variables NO hay reemplazo de URI, por eso se reenvía $request_uri
    # completo (/api/...), que coincide con el context-path del backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend:8080;
    proxy_pass http://$backend_host$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
