spring:
  application:
    name: phishware-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/phishware_db
    username: ${DB_USERNAME:phishware}
    password: ${DB_PASSWORD:phishware2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:phishware-super-secret-key-2024-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000       # 24 horas
    refresh-expiration-ms: 604800000  # 7 días

  # Google Safe Browsing API
  google-safe-browsing:
    api-key: ${GOOGLE_SAFE_BROWSING_KEY:YOUR_API_KEY}
    base-url: https://safebrowsing.googleapis.com/v4

  # VirusTotal API
  virus-total:
    api-key: ${VIRUSTOTAL_KEY:YOUR_API_KEY}
    base-url: https://www.virustotal.com/api/v3

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,https://phishware.app

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: PHISHWARE API
    description: API REST para el sistema de detección y prevención de phishing
    version: 1.0.0
    contact:
      name: PHISHWARE Team
      email: dev@phishware.com

# Logging
logging:
  level:
    com.phishware: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
